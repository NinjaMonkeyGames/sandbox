# Runs semantic-release on push to master/develop/release/*:
#   master     -> stable release
#   develop    -> beta prerelease
#   release/*  -> rc prerelease
# Config: .config/release.config.js (loaded via --extends, since
# semantic-release only auto-finds config at the repo root).
#
# Runs as nmg-bot (GitHub App token) because it needs actual write
# access: semantic-release's own auth check pushes a probe commit, and
# @semantic-release/git pushes the version bump + changelog for real.
# nmg-bot must be a bypass actor on master/develop's "require PR" rule.
#
# master/develop also require signed commits, with no bypass for that
# rule - the GPG import step below signs the version-bump commit.

name: Release

on:
  push:
    branches:
      - master
      - develop
      - 'release/**'

# Prevents two releases on the same branch racing (e.g. a merge and
# sync-master-to-develop.yaml landing seconds apart).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Mint nmg-bot installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # A freshly minted token can be rejected on first use before it
      # propagates.
      - name: Wait for installation token to propagate
        run: sleep 5

      # Signs the version-bump commit so it satisfies master/develop's
      # "require signed commits" rule.
      - name: Import nmg-bot GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_BOT }}
          passphrase: ${{ secrets.GPG_BOT }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_config_global: true

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release --extends ./.config/release.config.js