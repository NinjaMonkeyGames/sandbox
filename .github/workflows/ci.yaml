name: Release

on:
  push:
    branches:
      - master
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Needed to commit tags and release assets to GitHub
      issues: write        # Needed for semantic-release to open failure/release issues
      pull-requests: write # Needed to comment on PRs
      id-token: write      # CRITICAL: Required for npm OIDC Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release