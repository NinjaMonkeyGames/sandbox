name: CI/CD Pipeline

on:
  push:
    branches:
      - 'feature/**'
      - 'release/**'
      - 'master'
  pull_request:
    branches:
      - 'develop'
      - 'release/**'
      - 'master'
    types: [opened, synchronize, reopened, edited]
  merge_group:
    branches:
      - 'develop'
      - 'release/**'
      - 'master'
    types: [checks_requested]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Preview Checks & Feature Branch Publish
  # ---------------------------------------------------------------------------
  preview-checks:
    name: Preview - Lint & Feature Publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate nmg-bot Token
        id: nmg_bot_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.nmg_bot_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Commitlint
        run: npx commitlint --config .config/commitlint.config.js --last

      - name: ESLint
        run: npx eslint . --config eslint.config.js

      - name: Semantic Release (Feature Sandbox)
        env:
          GH_TOKEN: ${{ steps.nmg_bot_token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.nmg_bot_token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release --extends ./.config/release.config.js
        
  # ---------------------------------------------------------------------------
  # 3. Staging Release (Pushes to release/**)
  # ---------------------------------------------------------------------------
  staging-release:
    name: Staging - Release Candidate & Publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate nmg-bot Token
        id: nmg_bot_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.nmg_bot_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Markdownlint
        run: npx markdownlint-cli2 --config .config/.markdownlint-cli2.json "**/*.md"

      - name: ESLint
        run: npx eslint . --config eslint.config.js

      - name: Publish Staged Package to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag staging

 # ---------------------------------------------------------------------------
  # 4. Production Release (Runs AFTER Merge directly on master)
  # ---------------------------------------------------------------------------
  production-release:
    name: Production - Verification & Live NPM Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate nmg-bot Token
        id: nmg_bot_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.nmg_bot_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Markdownlint
        run: npx markdownlint-cli2 --config .config/.markdownlint-cli2.json "**/*.md"

      - name: ESLint
        run: npx eslint . --config eslint.config.js

      - name: Semantic Release (Live Publish to NPM)
        env:
          GH_TOKEN: ${{ steps.nmg_bot_token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.nmg_bot_token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release --extends ./.config/release.config.js