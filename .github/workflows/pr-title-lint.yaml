# Lints the pull request's title + body together as a single Conventional
# Commit message, reusing the *same* .config/commitlint.config.mjs (and its custom
# signed-off-by-regex plugin) that lints individual commits in
# preview.yaml. One set of rules, checked in both places - not a separate
# tool with its own duplicated type/scope list.
#
# Why title+body, not title alone: feature/* -> develop PRs are
# squash-merged (see CONTRIBUTING.md), so none of the branch's individual
# commits survive into develop's history - only the squash commit does.
# Checking signed-off-by (or any body/footer rule) against commits that are
# about to be discarded is redundant; the check has to run against what
# will actually persist, which is the PR's title and body.
#
# IMPORTANT: for a valid Signed-off-by line to actually carry into
# develop's history (not just pass this check), the repo's squash-merge
# default commit message must include the PR description:
#   Settings > General > Pull Requests > Allow squash merging >
#   Default commit message > "Pull request title and description"
# Otherwise GitHub's default squash message drops the body, and this
# check would be validating text that never reaches history.
#
# Scoped to feature/* source branches only (see the pull_request-specific
# `if:` guards on every step below) - any other PR into develop (release/*,
# hotfix/*, or the master-sync PR from sync-master-to-develop.yaml) uses a
# regular merge commit, where the PR title has no bearing on the resulting
# commit message at all. Linting it there would be checking something
# that was never going to matter.
#
# merge_group support: this also triggers when develop's Merge Queue is
# processing a PR. It deliberately does NOT try to re-derive "is this a
# feature/* PR" from the merge_group event - that event doesn't reliably
# expose the original PR's source branch, and guessing at its schema
# isn't something to build on. Instead: this check isn't
# integration-sensitive in the first place (a PR title/body's validity
# doesn't change based on what else is in the merge queue), so it was
# already conclusively answered when the PR's own pull_request-triggered
# run passed. The merge_group run is a deliberate, documented no-op that
# reports success - not a guess dressed up as a real check. See
# CONTRIBUTING.md for the same reasoning applied to preview.yaml, and for
# where a real (integration-sensitive) check should actually hook into
# merge_group.

name: Lint PR Message

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - develop
  merge_group:
    types: [checks_requested]

jobs:
  lint-pr-message:
    # Runs (never job-level skipped) for every merge_group event and for
    # feature/* pull_request events. A job-level skip is deliberately
    # avoided here - whether GitHub's merge queue treats a skipped
    # required job as "passing" isn't something this build has ever
    # relied on being reliable. Individual steps below skip themselves
    # instead, so the job actually runs and reports a genuine success.
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/'))
    runs-on: ubuntu-latest
    steps:
      - name: No-op for merge_group (see comment above)
        if: github.event_name == 'merge_group'
        run: echo "Not integration-sensitive; already verified when this PR was opened. Nothing to re-check here."

      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'

      - uses: actions/setup-node@v7
        if: github.event_name == 'pull_request'
        with:
          node-version: 24

      - name: Install commitlint
        if: github.event_name == 'pull_request'
        run: npm ci

      - name: Print commitlint version
        if: github.event_name == 'pull_request'
        run: npx commitlint --version

      # Title and body are passed via env, not interpolated directly into
      # the script, since PR title/body is untrusted user input.
      - name: Assemble title + body as one message
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$TITLE" "$BODY" > pr-message.txt

      # --edit tells commitlint to lint this file's raw content directly
      # (the same mode used for commit-msg git hooks), instead of its
      # default "derive commits from git" behaviour - which, with no
      # --edit/--from/--last given, was silently ignoring pr-message.txt
      # and linting the branch's last commit instead.
      - name: Lint against .config/commitlint.config.mjs
        if: github.event_name == 'pull_request'
        run: npx commitlint --config .config/commitlint.config.mjs --edit pr-message.txt